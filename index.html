</head>

<body>

<section class="hero">
  <div class="hero-inner">
    <h1>Customer Intelligence Recommender</h1>
  </div>
</section>

<div class="container">
  <div class="panel">
    <form id="recommend-form">

      <div class="toggle-row" role="group" aria-label="Customer Type">
        <button type="button" class="toggle-btn active" id="btn-existing" aria-pressed="true">
          Existing Customer
        </button>

        <button type="button" class="toggle-btn" id="btn-new" aria-pressed="false">
          New Customer
        </button>
      </div>

      <div class="fields-row">

        <div class="field" id="id-field">
          <label for="customer-id">Customer ID</label>

          <div class="input-wrap">
            <input
              type="number"
              id="customer-id"
              placeholder="Example: 17850"
              inputmode="numeric"
            >
          </div>
        </div>

        <div class="field">
          <label for="budget">Budget (Optional)</label>

          <div class="input-wrap">
            <input
              type="number"
              id="budget"
              placeholder="Example: 80"
              min="0"
              step="0.01"
            >
          </div>

          <div class="hint">
            Leave empty to show the best-selling products
          </div>
        </div>

      </div>

      <button type="submit" class="submit" id="submit-btn">
        Get Recommendations
      </button>

      <div class="status" id="status" role="status" aria-live="polite"></div>

    </form>

    <div class="insights" id="insights"></div>
  </div>

  <section class="results" id="results" aria-live="polite">

    <div class="results-title">
      Recommended Products
    </div>

    <div class="product-grid" id="product-grid"></div>

  </section>
</div>

<script>
  const API_URL = "https://online-retail-unsupervised.fastapicloud.dev/predict";

  const btnExisting = document.getElementById("btn-existing");
  const btnNew = document.getElementById("btn-new");
  const idField = document.getElementById("id-field");
  const customerIdInput = document.getElementById("customer-id");
  const budgetInput = document.getElementById("budget");
  const form = document.getElementById("recommend-form");
  const submitBtn = document.getElementById("submit-btn");
  const statusEl = document.getElementById("status");
  const insightsEl = document.getElementById("insights");
  const resultsEl = document.getElementById("results");
  const productGrid = document.getElementById("product-grid");

  let isNewCustomer = false;

  const CARD_GRADIENTS = [
    "linear-gradient(135deg,#0E7C7B,#12A3A1)",
    "linear-gradient(135deg,#6C5CE7,#8B7CF0)",
    "linear-gradient(135deg,#FF6B4A,#FF8F73)",
    "linear-gradient(135deg,#FFB020,#FFC85C)",
    "linear-gradient(135deg,#3B5BFF,#6C8CFF)",
  ];

  function categoryIcon(description){
    const d = (description || "").toUpperCase();

    if (d.includes("LIGHT") || d.includes("LAMP")) return "💡";
    if (d.includes("BAG")) return "👜";
    if (d.includes("MUG") || d.includes("CUP")) return "☕";
    if (d.includes("CARD")) return "🎴";
    if (d.includes("BOX")) return "📦";
    if (d.includes("CANDLE")) return "🕯";
    if (d.includes("CHAIR") || d.includes("CABINET") || d.includes("STOOL")) return "🪑";
    if (d.includes("HEART")) return "💗";
    if (d.includes("CAKE")) return "🧁";
    if (d.includes("CLOCK")) return "🕰";

    return "🎁";
  }

  function setCustomerType(newCustomer){
    isNewCustomer = newCustomer;

    btnExisting.classList.toggle("active", !newCustomer);
    btnNew.classList.toggle("active", newCustomer);

    btnExisting.setAttribute("aria-pressed", String(!newCustomer));
    btnNew.setAttribute("aria-pressed", String(newCustomer));

    idField.style.display = newCustomer ? "none" : "block";
  }

  btnExisting.addEventListener("click", () => setCustomerType(false));
  btnNew.addEventListener("click", () => setCustomerType(true));

  function setStatus(message, isError){
    statusEl.textContent = message || "";
    statusEl.classList.toggle("error", Boolean(isError));
  }

  function formatPrice(value){
    const num = Number(value);

    if (Number.isNaN(num)) return "$—";

    return "$" + num.toFixed(2);
  }

  function renderInsights(data){
    insightsEl.innerHTML = "";

    if (data.segment){
      const card = document.createElement("div");

      card.className = "insight-card segment";

      card.innerHTML =
        `<div class="label">Customer Segment</div>
         <div class="value">${data.segment}</div>`;

      insightsEl.appendChild(card);
    }

    if (typeof data.churn_risk === "number"){
      const card = document.createElement("div");

      card.className = "insight-card risk";

      card.innerHTML =
        `<div class="label">Churn Risk</div>
         <div class="value">${Math.round(data.churn_risk * 100)}%</div>`;

      insightsEl.appendChild(card);
    }
  }

  function renderProducts(products){
    productGrid.innerHTML = "";

    if (!products || products.length === 0){
      const empty = document.createElement("div");

      empty.className = "empty-note";
      empty.textContent = "No recommendations available.";

      productGrid.appendChild(empty);

      return;
    }

    products.forEach((item, i) => {
      const card = document.createElement("div");

      card.className = "product-card";

      const thumb = document.createElement("div");

      thumb.className = "product-thumb";
      thumb.style.background =
        CARD_GRADIENTS[i % CARD_GRADIENTS.length];

      thumb.textContent = categoryIcon(item.Description);

      if (item.image_path){
        const img = document.createElement("img");

        img.src = item.image_path;
        img.alt = item.Description || item.StockCode || "product";

        img.onerror = () => {
          img.remove();
        };

        thumb.textContent = "";
        thumb.appendChild(img);
      }

      const body = document.createElement("div");

      body.className = "product-body";

      const name = document.createElement("div");

      name.className = "product-name";
      name.textContent =
        item.Description || item.StockCode || "Product";

      const price = document.createElement("div");

      price.className = "product-price";
      price.textContent = formatPrice(item.UnitPrice);

      body.appendChild(name);
      body.appendChild(price);

      card.appendChild(thumb);
      card.appendChild(body);

      productGrid.appendChild(card);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
      is_new_customer: isNewCustomer,
      customer_id: null,
      budget: null
    };

    if (!isNewCustomer){
      const idVal = customerIdInput.value.trim();

      if (!idVal){
        setStatus("Please enter the Customer ID.", true);
        return;
      }

      payload.customer_id = Number(idVal);
    }

    const budgetVal = budgetInput.value.trim();

    if (budgetVal){
      payload.budget = Number(budgetVal);
    }

    submitBtn.disabled = true;

    setStatus("Getting recommendations...", false);

    resultsEl.classList.remove("visible");
    insightsEl.innerHTML = "";

    try{
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (!response.ok || data.error){
        setStatus(
          data.error || "Something went wrong. Please try again.",
          true
        );

        return;
      }

      setStatus("", false);

      renderInsights(data);
      renderProducts(data.recommended_products);

      resultsEl.classList.add("visible");

    } catch (err){
      setStatus(
        "Unable to connect to the server. Make sure it is running on 127.0.0.1:8000",
        true
      );

    } finally{
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
